version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ragsentinel-db
    environment:
      POSTGRES_DB: ragsentinel
      POSTGRES_USER: ragsentinel
      POSTGRES_PASSWORD: ragsentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./services/api
    container_name: ragsentinel-api
    environment:
      DATABASE_URL: postgresql://ragsvc:ragsvc@db:5432/ragsentinel
      CONFIG_DIR: /app/configs
      PYTHONPATH: /app
      HF_HOME: /models/hf
      FASTEMBED_CACHE_PATH: /models/fastembed
      SENTENCE_TRANSFORMERS_HOME: /models/st
      RETRIEVAL_FTS_K: "10"
      RETRIEVAL_DENSE_K: "10"
      RERANK_MODEL: "Xenova/ms-marco-MiniLM-L-6-v2"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./configs:/app/configs:ro
      - ./services/retrieval:/app/retrieval:ro
      - ./.model_cache:/models

  streamlit:
    build: ./services/streamlit
    container_name: ragsentinel-streamlit
    environment:
      API_BASE_URL: http://api:8000
      CONFIG_DIR: /app/configs
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./configs:/app/configs:ro

volumes:
  pgdata: