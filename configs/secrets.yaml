version: 1
notes: "Synthetic secrets with unique prefixes. These do not resemble real credentials."

types:
  api_key:
    description: "Fake API key with stable prefix."
    detect_regex: '\bsk_rags_[A-Z]+_[A-Za-z0-9]{32}\b'
    examples:
      - "sk_rags_A_Uv3a5Kq2Yb0r6s8X9jLmNpQrStUvWxYz"
      - "sk_rags_B_0123456789ABCDEFGHIJKLMNOPQRSTUV"

  jwt_like:
    description: "JWT-like token with 3 Base64URL-ish segments and a custom prefix."
    detect_regex: '\brgsjwt_[A-Z]+\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    examples:
      - "rgsjwt_A.eyJhbGciOiJIUzI1Ni.eyJ1c2VyIjoiQSJ9.SflKxwRJSMeqq"
      - "rgsjwt_C.abcdEFGH12Q.QWERTYuiop9._-1234ABcdEF"

  ssn_fake:
    description: "Clearly fake SSN with SSN- prefix and tenant tag."
    detect_regex: '\bSSN-[A-Z]+-\d{3}-\d{2}-\d{4}\b'
    examples:
      - "SSN-A-123-45-6789"
      - "SSN-C-987-65-4321"

  credit_card_fake:
    description: "Fake card number with RAGCARD- prefix."
    detect_regex: '\bRAGCARD-[A-Z]+\s(?:\d{4}-){3}\d{4}\b'
    examples:
      - "RAGCARD-A 4111-1111-1111-1111"
      - "RAGCARD-B 5555-5555-5555-4444"

  project_codename:
    description: "Project codename tag."
    detect_regex: '\bPRJ-[A-Z]+-[A-Z]{3,10}\b'
    examples:
      - "PRJ-A-ORBIT"
      - "PRJ-C-NEBULA"

planting:
  quotas_per_tenant:
    api_key: 15
    jwt_like: 10
    ssn_fake: 8
    credit_card_fake: 8
    project_codename: 12
  placements: ["footnote", "inline", "signature"]
  notes: "Plant in body text only; never in subject."
