llm:
  base_url: "https://api.groq.com/openai/v1"
  model: "openai/gpt-oss-20b"
  api_key_env: "LLM_API_KEY"
  timeout_s: 60
  timeout_seconds: 60
  max_tokens: 1024
  temperature: 0.1
  json_mode: false

embeddings:
  model: "BAAI/bge-large-en-v1.5"

reranker:
  model: "BAAI/bge-reranker-base"

nli:
  model: "microsoft/deberta-v3-base-mnli"
